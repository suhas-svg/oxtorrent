# Experiment 2: which piece strategy survives the seeder leaving early?
# The only seeder leaves once it has uploaded one full copy, and downloaders
# leave as soon as they finish, so pieces can disappear from the swarm.
# Use --availability-out to record the lowest piece availability over time.
name = "seeder_leaves"
file_size = 67108864        # 64 MiB
piece_size = 262144
piece_strategy = "rarest_first"
choke_strategy = "tit_for_tat"
upload_slots = 4
max_neighbors = 40
max_time_secs = 14400.0

[[groups]]
name = "seeder"
count = 1
upload_speed = 1048576
download_speed = 1048576
seed = true
leave_after_uploaded_copies = 1.0

[[groups]]
name = "downloader"
count = 200
upload_speed = 131072
download_speed = 1048576
join_start = 0.0
join_end = 300.0
leave_after_complete = 0.0
