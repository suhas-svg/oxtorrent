[package]
name = "oxtorrent"
version = "0.1.0"
edition = "2021"
description = "A command-line BitTorrent client with a built-in swarm simulator"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
csv = "1"
futures = "0.3"
percent-encoding = "2"
rand = "0.8"
rand_chacha = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1"
tempfile = "3"

[[bench]]
name = "bencode"
harness = false

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "picker"
harness = false

[profile.release]
debug = 1
